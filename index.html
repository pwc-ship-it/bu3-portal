<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BU3 Site Directory</title>
<style>
  :root{
    --bg:#0d1017;
    --bg-elev:#151a23;
    --bg-elev-2:#1c222d;
    --border:#2a3040;
    --border-soft:#232838;
    --text:#eef1f6;
    --text-dim:#98a1b3;
    --text-faint:#5f6779;
    --company:#5fa8ff;
    --company-soft:rgba(95,168,255,0.10);
    --bu3:#ff8a68;
    --bu3-soft:rgba(255,138,104,0.10);
    --public:#33e0c7;
    --public-soft:rgba(51,224,199,0.12);
    --internal:#ffb648;
    --internal-soft:rgba(255,182,72,0.12);
    --danger:#ff6b81;
    --radius:14px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    font-size:15px;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(circle at 10% -5%, rgba(95,168,255,0.08), transparent 40%),
      radial-gradient(circle at 92% 0%, rgba(255,138,104,0.07), transparent 40%);
    pointer-events:none;
    z-index:0;
  }
  .app{
    position:relative;
    z-index:1;
    width:100%;
    margin:0 auto;
    padding:22px 26px 40px;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{
    width:46px;height:46px;flex:none;
    border-radius:12px;
    background:linear-gradient(135deg,var(--company),var(--bu3));
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);
    font-weight:800;
    font-size:16px;
    color:#0a0c10;
  }
  .brand h1{
    margin:0;
    font-size:26px;
    letter-spacing:0.2px;
    font-weight:800;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand h1 .total{
    font-family:var(--mono);
    font-size:14px;
    font-weight:600;
    color:var(--text-faint);
  }
  .brand p{
    margin:2px 0 0;
    font-size:13.5px;
    color:var(--text-dim);
  }
  .topbar .controls{display:flex;gap:10px;align-items:center;}
  .search-wrap{position:relative;display:flex;align-items:center;}
  .search-wrap svg{position:absolute;left:13px;width:16px;height:16px;color:var(--text-faint);pointer-events:none;}
  #search{
    width:260px;background:var(--bg-elev);border:1px solid var(--border);color:var(--text);
    border-radius:11px;padding:11px 14px 11px 36px;font-size:14.5px;outline:none;transition:border-color .15s;
  }
  #search:focus{border-color:var(--company);}
  #search::placeholder{color:var(--text-faint);}
  .btn{
    border:none;cursor:pointer;border-radius:11px;font-size:14.5px;font-weight:700;padding:11px 18px;
    display:inline-flex;align-items:center;gap:7px;font-family:var(--sans);
    transition:transform .1s, opacity .15s, background .15s;
  }
  .btn:active{transform:scale(0.97);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-primary{background:var(--text);color:#12151b;}
  .btn-primary:hover{opacity:0.88;}
  .btn-ghost{background:var(--bg-elev);color:var(--text-dim);border:1px solid var(--border);}
  .btn-ghost:hover{color:var(--text);border-color:#3a4256;}
  .btn-danger{background:rgba(255,107,129,0.12);color:var(--danger);}
  .btn-danger:hover{background:rgba(255,107,129,0.22);}

  .tabgroups{
    display:flex;
    gap:34px;
    align-items:flex-start;
    flex-wrap:wrap;
    margin-bottom:22px;
  }
  .tabgroup-divider{
    width:1px;
    align-self:stretch;
    background:var(--border-soft);
    margin-top:26px;
  }
  .tabgroup{display:flex;flex-direction:column;gap:9px;}
  .tabgroup-label{
    font-family:var(--mono);
    font-size:13px;
    font-weight:700;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.08em;
    padding-left:3px;
  }
  .tabgroup.co .tabgroup-label{color:var(--company);}
  .tabgroup.bu .tabgroup-label{color:var(--bu3);}
  .tabgroup-buttons{display:flex;gap:9px;}
  .tab-btn{
    padding:13px 20px;
    border-radius:13px;
    border:1.5px solid var(--border);
    background:var(--bg-elev);
    color:var(--text-dim);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    min-width:128px;
    transition:border-color .15s, background .15s, color .15s;
  }
  .tab-btn .lbl{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .tab-btn .lbl svg{width:14px;height:14px;}
  .tab-btn .n{font-family:var(--mono);font-size:12px;color:var(--text-faint);}
  .tab-btn:hover{border-color:#3a4256;color:var(--text);}
  .tab-btn.active.public{background:var(--public-soft);border-color:var(--public);color:var(--public);}
  .tab-btn.active.internal{background:var(--internal-soft);border-color:var(--internal);color:var(--internal);}
  .tab-btn.active .n{color:inherit;opacity:0.75;}

  .tiles{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
  }
  .tile{
    width:168px;
    min-height:118px;
    border-radius:var(--radius);
    background:var(--bg-elev);
    border:1.5px solid var(--border-soft);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    cursor:pointer;
    position:relative;
    padding:14px 10px;
    transition:border-color .15s, transform .1s, background .15s;
    text-decoration:none;
  }
  .tile:hover{border-color:var(--company);transform:translateY(-2px);}
  .tile.bu3-tile:hover{border-color:var(--bu3);}
  .tile .num{
    font-family:var(--mono);
    font-size:36px;
    font-weight:800;
    color:var(--company);
    line-height:1;
  }
  .tile.bu3-tile .num{color:var(--bu3);}
  .tile .name{
    font-size:14.5px;
    font-weight:700;
    text-align:center;
    color:var(--text);
    text-transform:uppercase;
    letter-spacing:0.02em;
    line-height:1.25;
  }
  .tile.direct{gap:8px;}
  .tile.direct .icon{
    width:36px;height:36px;border-radius:10px;
    background:var(--bg-elev-2);
    display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);
  }
  .tile.direct .icon svg{width:17px;height:17px;}
  .tile.direct .name{font-size:15.5px;text-transform:none;letter-spacing:0;}

  .tile-actions{
    position:absolute;top:7px;right:7px;
    display:flex;gap:2px;
    opacity:0;
    transition:opacity .12s;
  }
  .tile:hover .tile-actions{opacity:1;}
  .icon-btn{
    width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:none;border:none;
    color:var(--text-faint);cursor:pointer;border-radius:7px;
  }
  .icon-btn:hover{background:var(--bg-elev-2);color:var(--text);}
  .icon-btn.danger:hover{color:var(--danger);}
  .icon-btn svg{width:14px;height:14px;}

  .empty{text-align:center;padding:60px 20px;color:var(--text-faint);font-size:14px;}

  .results{display:flex;flex-direction:column;gap:10px;}
  .result-card{
    background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:12px;
    padding:14px 16px;display:flex;align-items:center;gap:12px;text-decoration:none;
  }
  .result-card .r-icon{
    width:34px;height:34px;flex:none;border-radius:9px;background:var(--bg-elev-2);
    display:flex;align-items:center;justify-content:center;color:var(--text-dim);
  }
  .result-card .r-icon svg{width:16px;height:16px;}
  .result-card .r-main{flex:1;min-width:0;}
  .result-card .r-title{font-size:15px;font-weight:700;color:var(--text);}
  .result-card .r-crumb{font-family:var(--mono);font-size:11.5px;color:var(--text-faint);margin-top:2px;}
  .result-card .r-actions{display:flex;gap:4px;}

  .tip{position:relative;display:inline-flex;color:var(--text-faint);cursor:default;}
  .tip svg{width:14px;height:14px;}
  .tip::after{
    content:attr(data-tip);position:absolute;left:50%;bottom:130%;transform:translateX(-50%) translateY(4px);
    background:#2a3040;color:var(--text);font-size:12.5px;line-height:1.4;padding:8px 11px;border-radius:8px;
    width:max-content;max-width:240px;white-space:normal;box-shadow:0 6px 20px rgba(0,0,0,0.4);
    opacity:0;pointer-events:none;transition:opacity .12s, transform .12s;z-index:20;
  }
  .tip:hover::after{opacity:1;transform:translateX(-50%) translateY(0);}

  .overlay{position:fixed;inset:0;background:rgba(6,8,12,0.65);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--bg-elev);border:1px solid var(--border);border-radius:16px;width:100%;max-width:460px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,0.55);max-height:86vh;overflow-y:auto;}
  .modal h2{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:8px;}
  .modal .sub{margin:0 0 16px;font-size:12.5px;color:var(--text-dim);}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--text-dim);margin-bottom:6px;}
  .field .req{color:var(--bu3);}
  .field input, .field select, .field textarea{
    width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:9px;
    padding:9px 11px;font-size:14px;font-family:var(--sans);outline:none;
  }
  .field textarea{resize:vertical;min-height:60px;font-family:var(--sans);}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--company);}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}
  .modal-actions .right{display:flex;gap:8px;}

  .cat-list{display:flex;flex-direction:column;gap:2px;margin-top:4px;}
  .cat-row{
    display:flex;align-items:center;gap:10px;padding:12px 8px;border-bottom:1px solid var(--border-soft);
  }
  .cat-row:last-child{border-bottom:none;}
  .cat-row .dot{width:6px;height:6px;border-radius:50%;background:var(--company);flex:none;}
  .cat-row .c-title{flex:1;font-size:15.5px;font-weight:600;color:var(--text);text-decoration:none;min-width:0;}
  .cat-row .c-title:hover{color:var(--company);}
  .cat-row .c-url{display:block;font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cat-row-actions{display:flex;gap:2px;flex:none;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--bg-elev-2);
    border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:10px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:200;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  body:not(.admin-mode) .admin-only{display:none !important;}
  .admin-badge{
    display:none;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;font-weight:700;
    color:var(--internal);background:var(--internal-soft);padding:4px 10px;border-radius:20px;
  }
  body.admin-mode .admin-badge{display:inline-flex;}

  @media (max-width:760px){
    .app{padding:16px 14px 32px;}
    .topbar{flex-direction:column;align-items:stretch;}
    .topbar .controls{width:100%;}
    #search{flex:1;width:auto;}
    .tabgroups{gap:18px;}
    .tabgroup-divider{display:none;}
    .tab-btn{min-width:100px;padding:11px 14px;}
    .tile{width:calc(50% - 7px);}
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">B3</div>
      <div>
        <h1>BU3 Site Directory <span class="total" id="totalCount"></span> <span class="admin-badge" id="adminBadge">관리자 모드</span></h1>
        <p>회사 · BU3 시스템 링크 모음</p>
      </div>
    </div>
    <div class="controls">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="search" placeholder="사이트, 설명 검색…" />
      </div>
      <button class="btn btn-primary admin-only" id="addBtn">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>
        링크 추가
      </button>
    </div>
  </div>

  <div class="tabgroups" id="tabgroups">
    <div class="tabgroup co">
      <div class="tabgroup-label">회사</div>
      <div class="tabgroup-buttons">
        <button class="tab-btn public" data-main="회사" data-access="사내+외부">
          <span class="lbl">사내+외부</span><span class="n" data-count="회사|사내+외부">0개</span>
        </button>
        <button class="tab-btn internal" data-main="회사" data-access="사내전용">
          <span class="lbl">사내전용</span><span class="n" data-count="회사|사내전용">0개</span>
        </button>
      </div>
    </div>
    <div class="tabgroup-divider"></div>
    <div class="tabgroup bu">
      <div class="tabgroup-label">BU3</div>
      <div class="tabgroup-buttons">
        <button class="tab-btn public" data-main="BU3" data-access="사내+외부">
          <span class="lbl">사내+외부</span><span class="n" data-count="BU3|사내+외부">0개</span>
        </button>
        <button class="tab-btn internal" data-main="BU3" data-access="사내전용">
          <span class="lbl">사내전용</span><span class="n" data-count="BU3|사내전용">0개</span>
        </button>
      </div>
    </div>
  </div>

  <main id="content"><div class="empty">불러오는 중…</div></main>

</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
(function(){

  var ICONS = {
    link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 14a5 5 0 007.07 0l2.83-2.83a5 5 0 10-7.07-7.07L11.5 5.5"/><path d="M14 10a5 5 0 00-7.07 0L4.1 12.83a5 5 0 107.07 7.07L12.5 18.5"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>'
  };

  var state = {
    links: [],
    mainCategory: '회사',
    accessType: '사내+외부',
    query: '',
    isAdmin: false
  };

  function applyAdminClass(){
    document.body.classList.toggle('admin-mode', state.isAdmin);
  }

  (function initAdmin(){
    try{ state.isAdmin = localStorage.getItem('bu3_admin') === '1'; }catch(e){}
    applyAdminClass();
  })();

  function toggleAdmin(){
    state.isAdmin = !state.isAdmin;
    try{ localStorage.setItem('bu3_admin', state.isAdmin ? '1' : '0'); }catch(e){}
    applyAdminClass();
    showToast(state.isAdmin ? '관리자 모드로 전환했습니다.' : '일반(보기) 모드로 전환했습니다.');
  }

  function escapeHtml(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2400);
  }

  async function api(path, options){
    var res = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, options || {}));
    var data = null;
    try{ data = await res.json(); }catch(e){}
    if(!res.ok){ throw new Error((data && data.error) || ('요청 실패 (' + res.status + ')')); }
    return data;
  }

  async function load(){
    try{
      var data = await api('/api/links');
      state.links = data.links || [];
    }catch(e){
      console.error(e);
      document.getElementById('content').innerHTML = '<div class="empty">데이터를 불러오지 못했습니다. 새로고침해주세요.<br><span style="font-family:var(--mono);font-size:11px;">' + escapeHtml(e.message) + '</span></div>';
      return;
    }
    render();
  }

  function groupBy(links){
    var out = {};
    links.forEach(function(l){
      out[l.mainCategory] = out[l.mainCategory] || {};
      out[l.mainCategory][l.accessType] = out[l.mainCategory][l.accessType] || {};
      out[l.mainCategory][l.accessType][l.group] = out[l.mainCategory][l.accessType][l.group] || [];
      out[l.mainCategory][l.accessType][l.group].push(l);
    });
    return out;
  }

  function updateCounts(){
    document.getElementById('totalCount').textContent = state.links.length ? ('총 ' + state.links.length + '개') : '';
    document.querySelectorAll('.tab-btn').forEach(function(btn){
      var main = btn.dataset.main, access = btn.dataset.access;
      var n = state.links.filter(function(l){ return l.mainCategory === main && l.accessType === access; }).length;
      var el = btn.querySelector('.n');
      if(el) el.textContent = n + '개';
      btn.classList.toggle('active', main === state.mainCategory && access === state.accessType);
    });
  }

  function render(){
    updateCounts();
    var content = document.getElementById('content');

    var q = state.query.trim().toLowerCase();
    if(q){
      renderSearchResults(content, q);
      return;
    }

    var grouped = groupBy(state.links);
    var groupsMap = (grouped[state.mainCategory] && grouped[state.mainCategory][state.accessType]) || {};
    var groupNames = Object.keys(groupsMap);

    if(groupNames.length === 0){
      content.innerHTML = '<div class="empty">이 카테고리에는 아직 링크가 없습니다. 우측 상단 "링크 추가"로 등록해보세요.</div>';
      return;
    }

    var bu3Class = state.mainCategory === 'BU3' ? ' bu3-tile' : '';
    var html = '<div class="tiles">';
    groupNames.forEach(function(gname){
      var items = groupsMap[gname];
      if(items.length === 1 && !items[0].sub){
        html += renderDirectTile(items[0], bu3Class);
      }else{
        html += renderCountTile(gname, items, bu3Class);
      }
    });
    html += '</div>';
    content.innerHTML = html;
    bindGridEvents();
  }

  function renderDirectTile(l, bu3Class){
    return (
      '<div class="tile direct' + bu3Class + '" data-open-url="' + escapeHtml(l.url) + '">' +
        '<div class="icon">' + ICONS.link + '</div>' +
        '<div class="name">' + escapeHtml(l.group) + '</div>' +
        '<div class="tile-actions">' +
          (l.desc ? '<span class="tip" data-tip="' + escapeHtml(l.desc) + '">' + ICONS.info + '</span>' : '') +
          '<button class="icon-btn admin-only edit-tile-btn" data-id="' + l.id + '" title="수정">' + ICONS.edit + '</button>' +
          '<button class="icon-btn admin-only danger del-tile-btn" data-id="' + l.id + '" title="삭제">' + ICONS.trash + '</button>' +
        '</div>' +
      '</div>'
    );
  }

  function renderCountTile(gname, items, bu3Class){
    return (
      '<div class="tile' + bu3Class + '" data-open-group="' + escapeHtml(gname) + '">' +
        '<div class="num">' + items.length + '</div>' +
        '<div class="name">' + escapeHtml(gname) + '</div>' +
      '</div>'
    );
  }

  function bindGridEvents(){
    document.querySelectorAll('[data-open-url]').forEach(function(tile){
      tile.addEventListener('click', function(e){
        if(e.target.closest('.icon-btn') || e.target.closest('.tip')) return;
        window.open(tile.dataset.openUrl, '_blank', 'noopener');
      });
    });
    document.querySelectorAll('[data-open-group]').forEach(function(tile){
      tile.addEventListener('click', function(){
        openCategoryModal(state.mainCategory, state.accessType, tile.dataset.openGroup);
      });
    });
    document.querySelectorAll('.edit-tile-btn').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var link = state.links.find(function(l){ return l.id === btn.dataset.id; });
        if(link) openModal(link);
      });
    });
    document.querySelectorAll('.del-tile-btn').forEach(function(btn){
      btn.addEventListener('click', async function(e){
        e.stopPropagation();
        await deleteLink(btn.dataset.id);
        render();
      });
    });
  }

  function renderSearchResults(content, q){
    var results = state.links.filter(function(l){
      var hay = [l.group, l.sub, l.url, l.desc, l.mainCategory, l.accessType].join(' ').toLowerCase();
      return hay.indexOf(q) !== -1;
    });
    if(results.length === 0){
      content.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
      return;
    }
    var html = '<div class="results">';
    results.forEach(function(l){
      var label = l.sub ? l.sub : l.group;
      var crumb = l.mainCategory + ' · ' + l.accessType + (l.sub ? (' · ' + l.group) : '');
      var tip = l.desc ? '<span class="tip" data-tip="' + escapeHtml(l.desc) + '">' + ICONS.info + '</span>' : '';
      html +=
        '<div class="result-card" data-id="' + l.id + '">' +
          '<div class="r-icon">' + ICONS.link + '</div>' +
          '<div class="r-main">' +
            '<a class="r-title" href="' + escapeHtml(l.url) + '" target="_blank" rel="noopener">' + escapeHtml(label) + '</a> ' + tip +
            '<div class="r-crumb">' + escapeHtml(crumb) + '</div>' +
          '</div>' +
          '<div class="r-actions admin-only">' +
            '<button class="icon-btn edit-tile-btn" data-id="' + l.id + '" title="수정">' + ICONS.edit + '</button>' +
            '<button class="icon-btn danger del-tile-btn" data-id="' + l.id + '" title="삭제">' + ICONS.trash + '</button>' +
          '</div>' +
        '</div>';
    });
    html += '</div>';
    content.innerHTML = html;
    bindGridEvents();
  }

  async function deleteLink(id){
    var link = state.links.find(function(l){ return l.id === id; });
    if(!link) return false;
    var label = link.sub ? (link.group + ' · ' + link.sub) : link.group;
    if(!confirm('"' + label + '" 링크를 삭제할까요?')) return false;
    try{
      await api('/api/links/' + encodeURIComponent(id), { method: 'DELETE' });
      state.links = state.links.filter(function(l){ return l.id !== id; });
      showToast('삭제했습니다.');
      return true;
    }catch(err){
      showToast(err.message || '삭제에 실패했습니다.');
      return false;
    }
  }

  function openCategoryModal(main, access, group){
    var items = state.links.filter(function(l){
      return l.mainCategory === main && l.accessType === access && l.group === group;
    });
    var root = document.getElementById('modalRoot');

    if(items.length === 0){ closeModal(); render(); return; }

    var rows = items.map(function(l){
      var label = l.sub ? l.sub : group;
      var tip = l.desc ? '<span class="tip" data-tip="' + escapeHtml(l.desc) + '">' + ICONS.info + '</span>' : '';
      return (
        '<div class="cat-row">' +
          '<span class="dot"></span>' +
          '<div style="flex:1;min-width:0;">' +
            '<a class="c-title" href="' + escapeHtml(l.url) + '" target="_blank" rel="noopener">' + escapeHtml(label) + '</a> ' + tip +
            '<span class="c-url">' + escapeHtml(l.url) + '</span>' +
          '</div>' +
          '<div class="cat-row-actions admin-only">' +
            '<button class="icon-btn cat-edit-btn" data-id="' + l.id + '" title="수정">' + ICONS.edit + '</button>' +
            '<button class="icon-btn danger cat-del-btn" data-id="' + l.id + '" title="삭제">' + ICONS.trash + '</button>' +
          '</div>' +
        '</div>'
      );
    }).join('');

    root.innerHTML =
      '<div class="overlay" id="overlay">' +
        '<div class="modal">' +
          '<h2>' + escapeHtml(group) + '</h2>' +
          '<p class="sub">' + escapeHtml(main) + ' · ' + escapeHtml(access) + ' — ' + items.length + '개 링크</p>' +
          '<div class="cat-list">' + rows + '</div>' +
        '</div>' +
      '</div>';

    document.getElementById('overlay').addEventListener('click', function(e){
      if(e.target.id === 'overlay') closeModal();
    });
    root.querySelectorAll('.cat-edit-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var link = state.links.find(function(l){ return l.id === btn.dataset.id; });
        if(link) openModal(link, {main:main, access:access, group:group});
      });
    });
    root.querySelectorAll('.cat-del-btn').forEach(function(btn){
      btn.addEventListener('click', async function(){
        var ok = await deleteLink(btn.dataset.id);
        if(ok){
          var remaining = state.links.filter(function(l){
            return l.mainCategory === main && l.accessType === access && l.group === group;
          });
          if(remaining.length > 0){ openCategoryModal(main, access, group); }
          else { closeModal(); render(); }
        }
      });
    });
  }

  function existingGroups(mainCategory, accessType){
    var set = {};
    state.links.forEach(function(l){
      if(l.mainCategory === mainCategory && l.accessType === accessType) set[l.group] = true;
    });
    return Object.keys(set);
  }

  function openModal(existing, returnCtx){
    var isEdit = !!existing;
    var data = existing || {mainCategory: state.mainCategory, accessType: state.accessType, group:'', sub:'', url:'', desc:''};
    var root = document.getElementById('modalRoot');

    var groupOptions = existingGroups(data.mainCategory, data.accessType)
      .map(function(g){ return '<option value="' + escapeHtml(g) + '">'; }).join('');

    root.innerHTML =
      '<div class="overlay" id="overlay">' +
        '<div class="modal">' +
          '<h2>' + (isEdit ? '링크 수정' : '새 링크 추가') + '</h2>' +
          '<p class="sub">' + (isEdit ? '이 항목만 수정됩니다.' : '카테고리를 지정하고 링크를 등록하세요.') + '</p>' +

          '<div class="field-row">' +
            '<div class="field">' +
              '<label>대분류 <span class="req">*</span></label>' +
              '<select id="f-main">' +
                '<option value="회사"' + (data.mainCategory==='회사'?' selected':'') + '>회사</option>' +
                '<option value="BU3"' + (data.mainCategory==='BU3'?' selected':'') + '>BU3</option>' +
              '</select>' +
            '</div>' +
            '<div class="field">' +
              '<label>접근범위 <span class="req">*</span></label>' +
              '<select id="f-access">' +
                '<option value="사내+외부"' + (data.accessType==='사내+외부'?' selected':'') + '>사내+외부</option>' +
                '<option value="사내전용"' + (data.accessType==='사내전용'?' selected':'') + '>사내전용</option>' +
              '</select>' +
            '</div>' +
          '</div>' +

          '<div class="field">' +
            '<label>중분류 (그룹명) <span class="req">*</span></label>' +
            '<input id="f-group" list="group-suggest" value="' + escapeHtml(data.group) + '" placeholder="예: CXM, WMS, MAPS…" />' +
            '<datalist id="group-suggest">' + groupOptions + '</datalist>' +
          '</div>' +

          '<div class="field">' +
            '<label>세부항목 (선택)</label>' +
            '<input id="f-sub" value="' + escapeHtml(data.sub) + '" placeholder="예: LGES — 비워두면 단독 링크로 표시" />' +
          '</div>' +

          '<div class="field">' +
            '<label>URL <span class="req">*</span></label>' +
            '<input id="f-url" value="' + escapeHtml(data.url) + '" placeholder="https:// 또는 http://IP:포트" />' +
          '</div>' +

          '<div class="field">' +
            '<label>설명 (선택 — 마우스오버 툴팁으로 표시)</label>' +
            '<textarea id="f-desc" placeholder="이 링크가 무엇인지 짧게 설명해주세요">' + escapeHtml(data.desc) + '</textarea>' +
          '</div>' +

          '<div class="modal-actions">' +
            (isEdit ? '<button class="btn btn-danger" id="deleteInModal">삭제</button>' : '<span></span>') +
            '<div class="right">' +
              '<button class="btn btn-ghost" id="cancelModal">취소</button>' +
              '<button class="btn btn-primary" id="saveModal">저장</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    document.getElementById('f-main').addEventListener('change', refreshGroupSuggest);
    document.getElementById('f-access').addEventListener('change', refreshGroupSuggest);
    function refreshGroupSuggest(){
      var m = document.getElementById('f-main').value;
      var a = document.getElementById('f-access').value;
      document.getElementById('group-suggest').innerHTML = existingGroups(m,a)
        .map(function(g){ return '<option value="' + escapeHtml(g) + '">'; }).join('');
    }

    document.getElementById('overlay').addEventListener('click', function(e){
      if(e.target.id === 'overlay'){
        if(returnCtx) openCategoryModal(returnCtx.main, returnCtx.access, returnCtx.group);
        else closeModal();
      }
    });
    document.getElementById('cancelModal').addEventListener('click', function(){
      if(returnCtx) openCategoryModal(returnCtx.main, returnCtx.access, returnCtx.group);
      else closeModal();
    });

    document.getElementById('saveModal').addEventListener('click', async function(){
      var main = document.getElementById('f-main').value;
      var access = document.getElementById('f-access').value;
      var group = document.getElementById('f-group').value.trim();
      var sub = document.getElementById('f-sub').value.trim();
      var url = document.getElementById('f-url').value.trim();
      var desc = document.getElementById('f-desc').value.trim();

      if(!group){ showToast('중분류(그룹명)를 입력해주세요.'); return; }
      if(!url){ showToast('URL을 입력해주세요.'); return; }
      if(!/^https?:\/\//i.test(url)){ showToast('URL은 http:// 또는 https:// 로 시작해야 합니다.'); return; }

      var payload = { mainCategory: main, accessType: access, group: group, sub: sub, url: url, desc: desc };
      var saveBtn = document.getElementById('saveModal');
      saveBtn.disabled = true;

      try{
        if(isEdit){
          var result = await api('/api/links/' + encodeURIComponent(existing.id), { method:'PUT', body:JSON.stringify(payload) });
          var i = state.links.findIndex(function(l){ return l.id === existing.id; });
          if(i !== -1) state.links[i] = result.link;
        }else{
          var created = await api('/api/links', { method:'POST', body:JSON.stringify(payload) });
          state.links.push(created.link);
        }
        showToast(isEdit ? '수정했습니다.' : '추가했습니다.');
        state.mainCategory = main; state.accessType = access;
        if(returnCtx){ openCategoryModal(main, access, group); }
        else { closeModal(); render(); }
        render();
      }catch(err){
        saveBtn.disabled = false;
        showToast(err.message || '저장에 실패했습니다.');
      }
    });

    if(isEdit){
      document.getElementById('deleteInModal').addEventListener('click', async function(){
        var ok = await deleteLink(existing.id);
        if(ok){
          if(returnCtx){
            var remaining = state.links.filter(function(l){
              return l.mainCategory === returnCtx.main && l.accessType === returnCtx.access && l.group === returnCtx.group;
            });
            if(remaining.length > 0){ openCategoryModal(returnCtx.main, returnCtx.access, returnCtx.group); return; }
          }
          closeModal();
          render();
        }
      });
    }

    document.getElementById('f-group').focus();
  }

  function closeModal(){
    document.getElementById('modalRoot').innerHTML = '';
  }

  document.querySelector('.brand-mark').addEventListener('click', function(e){
    if(e.ctrlKey || e.metaKey){
      e.preventDefault();
      toggleAdmin();
    }
  });

  document.getElementById('addBtn').addEventListener('click', function(){ openModal(null); });
  document.getElementById('search').addEventListener('input', function(e){
    state.query = e.target.value;
    render();
  });
  document.getElementById('tabgroups').addEventListener('click', function(e){
    var btn = e.target.closest('.tab-btn');
    if(!btn) return;
    state.mainCategory = btn.dataset.main;
    state.accessType = btn.dataset.access;
    render();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeModal();
  });

  load();
})();
</script>
</body>
</html>
