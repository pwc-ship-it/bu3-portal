<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BU3 Site Directory</title>
<style>
  :root{
    --bg:#11141a;
    --bg-elev:#181c24;
    --bg-elev-2:#1f2430;
    --border:#2a3040;
    --border-soft:#232838;
    --text:#e9ecf2;
    --text-dim:#8b93a6;
    --text-faint:#5a6274;
    --company:#5b8def;
    --company-soft:rgba(91,141,239,0.12);
    --bu3:#ff7a59;
    --bu3-soft:rgba(255,122,89,0.12);
    --public:#2dd4bf;
    --public-soft:rgba(45,212,191,0.12);
    --internal:#f5a623;
    --internal-soft:rgba(245,166,35,0.12);
    --danger:#ef5a6f;
    --radius:12px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(circle at 15% 0%, rgba(91,141,239,0.06), transparent 45%),
      radial-gradient(circle at 85% 10%, rgba(255,122,89,0.05), transparent 45%);
    pointer-events:none;
    z-index:0;
  }
  .app{
    position:relative;
    z-index:1;
    max-width:1180px;
    margin:0 auto;
    padding:28px 24px 80px;
  }

  .topbar{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
    margin-bottom:22px;
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{
    width:42px;height:42px;flex:none;
    border-radius:10px;
    background:linear-gradient(135deg,var(--company),var(--bu3));
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);
    font-weight:700;
    font-size:15px;
    color:#0d0f13;
  }
  .brand h1{margin:0;font-size:19px;letter-spacing:0.2px;font-weight:700;}
  .brand p{margin:2px 0 0;font-size:12.5px;color:var(--text-dim);}
  .topbar .controls{display:flex;gap:10px;align-items:center;}
  .search-wrap{position:relative;display:flex;align-items:center;}
  .search-wrap svg{position:absolute;left:11px;width:15px;height:15px;color:var(--text-faint);pointer-events:none;}
  #search{
    width:230px;background:var(--bg-elev);border:1px solid var(--border);color:var(--text);
    border-radius:9px;padding:9px 12px 9px 32px;font-size:13px;outline:none;transition:border-color .15s;
  }
  #search:focus{border-color:var(--company);}
  #search::placeholder{color:var(--text-faint);}
  .btn{
    border:none;cursor:pointer;border-radius:9px;font-size:13px;font-weight:600;padding:9px 14px;
    display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);
    transition:transform .1s, opacity .15s, background .15s;
  }
  .btn:active{transform:scale(0.97);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-primary{background:var(--text);color:#12151b;}
  .btn-primary:hover{opacity:0.88;}
  .btn-ghost{background:var(--bg-elev);color:var(--text-dim);border:1px solid var(--border);}
  .btn-ghost:hover{color:var(--text);border-color:#3a4256;}
  .btn-danger{background:rgba(239,90,111,0.12);color:var(--danger);}
  .btn-danger:hover{background:rgba(239,90,111,0.22);}

  .tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--border-soft);}
  .tab{
    background:none;border:none;color:var(--text-dim);font-family:var(--sans);font-size:13.5px;font-weight:600;
    padding:9px 4px;margin-right:18px;cursor:pointer;border-bottom:2px solid transparent;
    display:flex;align-items:center;gap:7px;transition:color .15s;
  }
  .tab .count{font-family:var(--mono);font-size:11px;color:var(--text-faint);background:var(--bg-elev-2);padding:1px 6px;border-radius:20px;}
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--text);border-bottom-color:var(--text);}

  .section{margin-bottom:30px;}
  .section-head{display:flex;align-items:center;gap:9px;margin-bottom:12px;}
  .access-pill{
    display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:0.03em;
    font-weight:600;padding:4px 9px 4px 8px;border-radius:20px;
  }
  .access-pill svg{width:11px;height:11px;}
  .access-pill.public{background:var(--public-soft);color:var(--public);}
  .access-pill.internal{background:var(--internal-soft);color:var(--internal);}
  .section-head .line{flex:1;height:1px;background:var(--border-soft);}
  .section-head .maincat{font-family:var(--mono);font-size:11px;color:var(--text-faint);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px;}
  .card{background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:var(--radius);overflow:hidden;transition:border-color .15s;}
  .card:hover{border-color:#38405a;}

  .card.simple{padding:13px 14px;display:flex;align-items:center;gap:10px;}
  .card.simple .link-icon{
    width:30px;height:30px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;
    background:var(--bg-elev-2);color:var(--text-dim);
  }
  .card.simple .link-icon svg{width:15px;height:15px;}
  .card.simple .link-main{flex:1;min-width:0;}
  .card.simple .link-title{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px;color:var(--text);text-decoration:none;}
  .card.simple .link-title:hover{color:var(--company);}
  .card.simple .link-url{
    font-family:var(--mono);font-size:10.5px;color:var(--text-faint);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;display:block;margin-top:2px;
  }

  .card.group .card-head{
    padding:10px 14px;background:var(--bg-elev-2);border-bottom:1px solid var(--border-soft);
    display:flex;align-items:center;gap:8px;
  }
  .card.group .card-head .grp-name{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:0.02em;color:var(--text);}
  .card.group .card-head .grp-count{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);margin-left:auto;}
  .row{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--border-soft);}
  .row:last-child{border-bottom:none;}
  .row .dot{width:5px;height:5px;border-radius:50%;background:var(--text-faint);flex:none;}
  .row .link-title{flex:1;font-size:13px;color:var(--text);text-decoration:none;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .link-title:hover{color:var(--company);}

  .row-actions, .card-actions{display:flex;gap:4px;opacity:0;transition:opacity .12s;flex:none;}
  .card:hover .row-actions, .card:hover .card-actions{opacity:1;}
  .icon-btn{
    width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:none;border:none;
    color:var(--text-faint);cursor:pointer;border-radius:6px;
  }
  .icon-btn:hover{background:var(--bg-elev-2);color:var(--text);}
  .icon-btn.danger:hover{color:var(--danger);}
  .icon-btn svg{width:13px;height:13px;}

  .tip{position:relative;display:inline-flex;color:var(--text-faint);cursor:default;}
  .tip svg{width:13px;height:13px;}
  .tip::after{
    content:attr(data-tip);position:absolute;left:50%;bottom:130%;transform:translateX(-50%) translateY(4px);
    background:#2a3040;color:var(--text);font-size:11.5px;line-height:1.4;padding:7px 10px;border-radius:7px;
    width:max-content;max-width:220px;white-space:normal;box-shadow:0 6px 20px rgba(0,0,0,0.4);
    opacity:0;pointer-events:none;transition:opacity .12s, transform .12s;z-index:20;
  }
  .tip:hover::after{opacity:1;transform:translateX(-50%) translateY(0);}

  .empty{text-align:center;padding:60px 20px;color:var(--text-faint);font-size:13px;}

  .overlay{position:fixed;inset:0;background:rgba(8,10,14,0.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--bg-elev);border:1px solid var(--border);border-radius:14px;width:100%;max-width:420px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
  .modal h2{margin:0 0 4px;font-size:15px;}
  .modal .sub{margin:0 0 16px;font-size:12px;color:var(--text-dim);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--text-dim);margin-bottom:5px;}
  .field .req{color:var(--bu3);}
  .field input, .field select, .field textarea{
    width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;
    padding:8px 10px;font-size:13px;font-family:var(--sans);outline:none;
  }
  .field textarea{resize:vertical;min-height:56px;font-family:var(--sans);}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--company);}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}
  .modal-actions .right{display:flex;gap:8px;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--bg-elev-2);
    border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:9px;font-size:12.5px;
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:200;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .footnote{margin-top:36px;text-align:center;font-size:11px;color:var(--text-faint);}

  @media (max-width:640px){
    .topbar{flex-direction:column;align-items:stretch;}
    .topbar .controls{width:100%;}
    #search{flex:1;width:auto;}
    .grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">B3</div>
      <div>
        <h1>BU3 Site Directory</h1>
        <p>회사 · BU3 시스템 링크 모음 — 검색해서 바로 접속하세요</p>
      </div>
    </div>
    <div class="controls">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="search" placeholder="사이트, 설명 검색…" />
      </div>
      <button class="btn btn-primary" id="addBtn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
        링크 추가
      </button>
    </div>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="all">전체 <span class="count" id="count-all">0</span></button>
    <button class="tab" data-tab="회사">회사 <span class="count" id="count-회사">0</span></button>
    <button class="tab" data-tab="BU3">BU3 <span class="count" id="count-BU3">0</span></button>
  </nav>

  <main id="content"><div class="empty">불러오는 중…</div></main>

  <div class="footnote">데이터는 Vercel KV에 저장되며, 이 페이지에 접속하는 모든 사용자가 같은 목록을 봅니다.</div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
(function(){

  var ICONS = {
    lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 118 0v4"/></svg>',
    globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a13 13 0 010 18M12 3a13 13 0 000 18"/></svg>',
    link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 14a5 5 0 007.07 0l2.83-2.83a5 5 0 10-7.07-7.07L11.5 5.5"/><path d="M14 10a5 5 0 00-7.07 0L4.1 12.83a5 5 0 107.07 7.07L12.5 18.5"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>'
  };

  var state = { links: [], tab: 'all', query: '', loaded: false };

  function escapeHtml(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2400);
  }

  async function api(path, options){
    var res = await fetch(path, Object.assign({
      headers: {'Content-Type':'application/json'}
    }, options || {}));
    var data = null;
    try{ data = await res.json(); }catch(e){}
    if(!res.ok){
      throw new Error((data && data.error) || ('요청 실패 (' + res.status + ')'));
    }
    return data;
  }

  async function load(){
    try{
      var data = await api('/api/links');
      state.links = data.links || [];
    }catch(e){
      console.error(e);
      document.getElementById('content').innerHTML = '<div class="empty">데이터를 불러오지 못했습니다. 새로고침해주세요.<br><span style="font-family:var(--mono);font-size:11px;">' + escapeHtml(e.message) + '</span></div>';
      return;
    }
    state.loaded = true;
    render();
  }

  function filteredLinks(){
    var q = state.query.trim().toLowerCase();
    return state.links.filter(function(l){
      if(state.tab !== 'all' && l.mainCategory !== state.tab) return false;
      if(!q) return true;
      var hay = [l.group, l.sub, l.url, l.desc].join(' ').toLowerCase();
      return hay.indexOf(q) !== -1;
    });
  }

  function groupBy(links){
    var out = {};
    links.forEach(function(l){
      out[l.mainCategory] = out[l.mainCategory] || {};
      out[l.mainCategory][l.accessType] = out[l.mainCategory][l.accessType] || {};
      out[l.mainCategory][l.accessType][l.group] = out[l.mainCategory][l.accessType][l.group] || [];
      out[l.mainCategory][l.accessType][l.group].push(l);
    });
    return out;
  }

  var MAIN_ORDER = ['회사','BU3'];
  var ACCESS_ORDER = ['사내+외부','사내전용'];

  function render(){
    updateTabCounts();
    document.querySelectorAll('.tab').forEach(function(t){
      t.classList.toggle('active', t.dataset.tab === state.tab);
    });

    var content = document.getElementById('content');
    var links = filteredLinks();

    if(links.length === 0){
      content.innerHTML = '<div class="empty">조건에 맞는 링크가 없습니다. 검색어를 바꾸거나 새 링크를 추가해보세요.</div>';
      return;
    }

    var grouped = groupBy(links);
    var mains = MAIN_ORDER.filter(function(m){ return grouped[m]; });
    Object.keys(grouped).forEach(function(m){ if(mains.indexOf(m) === -1) mains.push(m); });

    var html = '';
    mains.forEach(function(main){
      var accessMap = grouped[main];
      var accesses = ACCESS_ORDER.filter(function(a){ return accessMap[a]; });
      Object.keys(accessMap).forEach(function(a){ if(accesses.indexOf(a) === -1) accesses.push(a); });

      accesses.forEach(function(access){
        var groupsMap = accessMap[access];
        var groupNames = Object.keys(groupsMap);
        var pillClass = access === '사내전용' ? 'internal' : 'public';
        var pillIcon = access === '사내전용' ? ICONS.lock : ICONS.globe;

        html += '<section class="section">';
        html += '<div class="section-head">';
        html += '<span class="maincat">' + escapeHtml(main) + '</span>';
        html += '<span class="access-pill ' + pillClass + '">' + pillIcon + escapeHtml(access) + '</span>';
        html += '<span class="line"></span>';
        html += '</div>';
        html += '<div class="grid">';

        groupNames.forEach(function(gname){
          var items = groupsMap[gname];
          if(items.length === 1 && !items[0].sub){
            html += renderSimpleCard(items[0]);
          }else{
            html += renderGroupCard(gname, items);
          }
        });

        html += '</div></section>';
      });
    });

    content.innerHTML = html;
    bindContentEvents();
  }

  function renderSimpleCard(l){
    var tip = l.desc ? '<span class="tip" data-tip="' + escapeHtml(l.desc) + '">' + ICONS.info + '</span>' : '';
    return (
      '<div class="card simple" data-id="' + l.id + '">' +
        '<div class="link-icon">' + ICONS.link + '</div>' +
        '<div class="link-main">' +
          '<a class="link-title" href="' + escapeHtml(l.url) + '" target="_blank" rel="noopener">' +
            escapeHtml(l.group) + tip +
          '</a>' +
          '<span class="link-url">' + escapeHtml(l.url) + '</span>' +
        '</div>' +
        '<div class="card-actions">' +
          '<button class="icon-btn edit-btn" data-id="' + l.id + '" title="수정">' + ICONS.edit + '</button>' +
          '<button class="icon-btn danger del-btn" data-id="' + l.id + '" title="삭제">' + ICONS.trash + '</button>' +
        '</div>' +
      '</div>'
    );
  }

  function renderGroupCard(gname, items){
    var rows = items.map(function(l){
      var label = l.sub ? l.sub : gname;
      var tip = l.desc ? '<span class="tip" data-tip="' + escapeHtml(l.desc) + '">' + ICONS.info + '</span>' : '';
      return (
        '<div class="row" data-id="' + l.id + '">' +
          '<span class="dot"></span>' +
          '<a class="link-title" href="' + escapeHtml(l.url) + '" target="_blank" rel="noopener">' + escapeHtml(label) + '</a>' +
          tip +
          '<div class="row-actions">' +
            '<button class="icon-btn edit-btn" data-id="' + l.id + '" title="수정">' + ICONS.edit + '</button>' +
            '<button class="icon-btn danger del-btn" data-id="' + l.id + '" title="삭제">' + ICONS.trash + '</button>' +
          '</div>' +
        '</div>'
      );
    }).join('');

    return (
      '<div class="card group">' +
        '<div class="card-head">' +
          '<span class="grp-name">' + escapeHtml(gname) + '</span>' +
          '<span class="grp-count">' + items.length + '개</span>' +
        '</div>' +
        rows +
      '</div>'
    );
  }

  function updateTabCounts(){
    document.getElementById('count-all').textContent = state.links.length;
    ['회사','BU3'].forEach(function(m){
      var el = document.getElementById('count-' + m);
      if(el) el.textContent = state.links.filter(function(l){return l.mainCategory === m;}).length;
    });
  }

  function bindContentEvents(){
    document.querySelectorAll('.edit-btn').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.preventDefault();
        var id = btn.dataset.id;
        var link = state.links.find(function(l){ return l.id === id; });
        if(link) openModal(link);
      });
    });
    document.querySelectorAll('.del-btn').forEach(function(btn){
      btn.addEventListener('click', async function(e){
        e.preventDefault();
        var id = btn.dataset.id;
        var link = state.links.find(function(l){ return l.id === id; });
        if(!link) return;
        var label = link.sub ? (link.group + ' · ' + link.sub) : link.group;
        if(!confirm('"' + label + '" 링크를 삭제할까요?')) return;
        try{
          await api('/api/links/' + encodeURIComponent(id), { method: 'DELETE' });
          state.links = state.links.filter(function(l){ return l.id !== id; });
          render();
          showToast('삭제했습니다.');
        }catch(err){
          showToast(err.message || '삭제에 실패했습니다.');
        }
      });
    });
  }

  function existingGroups(mainCategory, accessType){
    var set = {};
    state.links.forEach(function(l){
      if(l.mainCategory === mainCategory && l.accessType === accessType) set[l.group] = true;
    });
    return Object.keys(set);
  }

  function openModal(existing){
    var isEdit = !!existing;
    var data = existing || {mainCategory:'회사', accessType:'사내+외부', group:'', sub:'', url:'', desc:''};
    var root = document.getElementById('modalRoot');

    var groupOptions = existingGroups(data.mainCategory, data.accessType)
      .map(function(g){ return '<option value="' + escapeHtml(g) + '">'; }).join('');

    root.innerHTML =
      '<div class="overlay" id="overlay">' +
        '<div class="modal">' +
          '<h2>' + (isEdit ? '링크 수정' : '새 링크 추가') + '</h2>' +
          '<p class="sub">' + (isEdit ? '이 항목만 수정됩니다.' : '카테고리를 지정하고 링크를 등록하세요.') + '</p>' +

          '<div class="field-row">' +
            '<div class="field">' +
              '<label>대분류 <span class="req">*</span></label>' +
              '<select id="f-main">' +
                '<option value="회사"' + (data.mainCategory==='회사'?' selected':'') + '>회사</option>' +
                '<option value="BU3"' + (data.mainCategory==='BU3'?' selected':'') + '>BU3</option>' +
              '</select>' +
            '</div>' +
            '<div class="field">' +
              '<label>접근범위 <span class="req">*</span></label>' +
              '<select id="f-access">' +
                '<option value="사내+외부"' + (data.accessType==='사내+외부'?' selected':'') + '>사내+외부</option>' +
                '<option value="사내전용"' + (data.accessType==='사내전용'?' selected':'') + '>사내전용</option>' +
              '</select>' +
            '</div>' +
          '</div>' +

          '<div class="field">' +
            '<label>중분류 (그룹명) <span class="req">*</span></label>' +
            '<input id="f-group" list="group-suggest" value="' + escapeHtml(data.group) + '" placeholder="예: CXM, WMS, MAPS…" />' +
            '<datalist id="group-suggest">' + groupOptions + '</datalist>' +
          '</div>' +

          '<div class="field">' +
            '<label>세부항목 (선택)</label>' +
            '<input id="f-sub" value="' + escapeHtml(data.sub) + '" placeholder="예: LGES — 비워두면 단독 링크로 표시" />' +
          '</div>' +

          '<div class="field">' +
            '<label>URL <span class="req">*</span></label>' +
            '<input id="f-url" value="' + escapeHtml(data.url) + '" placeholder="https:// 또는 http://IP:포트" />' +
          '</div>' +

          '<div class="field">' +
            '<label>설명 (선택 — 마우스오버 툴팁으로 표시)</label>' +
            '<textarea id="f-desc" placeholder="이 링크가 무엇인지 짧게 설명해주세요">' + escapeHtml(data.desc) + '</textarea>' +
          '</div>' +

          '<div class="modal-actions">' +
            (isEdit ? '<button class="btn btn-danger" id="deleteInModal">삭제</button>' : '<span></span>') +
            '<div class="right">' +
              '<button class="btn btn-ghost" id="cancelModal">취소</button>' +
              '<button class="btn btn-primary" id="saveModal">저장</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    document.getElementById('f-main').addEventListener('change', refreshGroupSuggest);
    document.getElementById('f-access').addEventListener('change', refreshGroupSuggest);
    function refreshGroupSuggest(){
      var m = document.getElementById('f-main').value;
      var a = document.getElementById('f-access').value;
      document.getElementById('group-suggest').innerHTML = existingGroups(m,a)
        .map(function(g){ return '<option value="' + escapeHtml(g) + '">'; }).join('');
    }

    document.getElementById('overlay').addEventListener('click', function(e){
      if(e.target.id === 'overlay') closeModal();
    });
    document.getElementById('cancelModal').addEventListener('click', closeModal);

    document.getElementById('saveModal').addEventListener('click', async function(){
      var main = document.getElementById('f-main').value;
      var access = document.getElementById('f-access').value;
      var group = document.getElementById('f-group').value.trim();
      var sub = document.getElementById('f-sub').value.trim();
      var url = document.getElementById('f-url').value.trim();
      var desc = document.getElementById('f-desc').value.trim();

      if(!group){ showToast('중분류(그룹명)를 입력해주세요.'); return; }
      if(!url){ showToast('URL을 입력해주세요.'); return; }
      if(!/^https?:\/\//i.test(url)){ showToast('URL은 http:// 또는 https:// 로 시작해야 합니다.'); return; }

      var payload = { mainCategory: main, accessType: access, group: group, sub: sub, url: url, desc: desc };
      var saveBtn = document.getElementById('saveModal');
      saveBtn.disabled = true;

      try{
        if(isEdit){
          var result = await api('/api/links/' + encodeURIComponent(existing.id), {
            method: 'PUT', body: JSON.stringify(payload)
          });
          var i = state.links.findIndex(function(l){ return l.id === existing.id; });
          if(i !== -1) state.links[i] = result.link;
        }else{
          var created = await api('/api/links', { method: 'POST', body: JSON.stringify(payload) });
          state.links.push(created.link);
        }
        closeModal();
        render();
        showToast(isEdit ? '수정했습니다.' : '추가했습니다.');
      }catch(err){
        saveBtn.disabled = false;
        showToast(err.message || '저장에 실패했습니다.');
      }
    });

    if(isEdit){
      document.getElementById('deleteInModal').addEventListener('click', async function(){
        var label = data.sub ? (data.group + ' · ' + data.sub) : data.group;
        if(!confirm('"' + label + '" 링크를 삭제할까요?')) return;
        try{
          await api('/api/links/' + encodeURIComponent(existing.id), { method: 'DELETE' });
          state.links = state.links.filter(function(l){ return l.id !== existing.id; });
          closeModal();
          render();
          showToast('삭제했습니다.');
        }catch(err){
          showToast(err.message || '삭제에 실패했습니다.');
        }
      });
    }

    document.getElementById('f-group').focus();
  }

  function closeModal(){
    document.getElementById('modalRoot').innerHTML = '';
  }

  document.getElementById('addBtn').addEventListener('click', function(){ openModal(null); });
  document.getElementById('search').addEventListener('input', function(e){
    state.query = e.target.value;
    render();
  });
  document.getElementById('tabs').addEventListener('click', function(e){
    var btn = e.target.closest('.tab');
    if(!btn) return;
    state.tab = btn.dataset.tab;
    render();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeModal();
  });

  load();
})();
</script>
</body>
</html>
