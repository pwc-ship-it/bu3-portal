<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BU3 Site Directory</title>
<style>
  :root{
    --bg:#0F131B;
    --card:#171D27;
    --card-hover:#1D2531;
    --border:rgba(255,255,255,0.09);
    --border-soft:rgba(255,255,255,0.05);
    --text:#F1F5F9;
    --text-dim:#A7B0BF;
    --text-faint:#7C8697;
    --company:#5B8DEF;
    --company-soft:rgba(91,141,239,0.16);
    --company-soft-2:rgba(91,141,239,0.07);
    --bu3:#2ED9C3;
    --bu3-soft:rgba(46,217,195,0.16);
    --bu3-soft-2:rgba(46,217,195,0.07);
    --danger:#FF6B81;
    --danger-soft:rgba(255,107,129,0.14);
    --internal:#F0975A;
    --internal-soft:rgba(240,151,90,0.18);
    --pin:#FFC94D;
    --pin-soft:rgba(255,201,77,0.10);
    --radius:12px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    font-size:15px;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(circle at 8% -5%, rgba(91,141,239,0.07), transparent 42%),
      radial-gradient(circle at 94% 0%, rgba(46,217,195,0.06), transparent 42%);
    pointer-events:none;
    z-index:0;
  }
  .app{
    position:relative;
    z-index:1;
    width:100%;
    max-width:1800px;
    margin:0 auto;
    padding:20px 32px 30px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{
    width:42px;height:42px;flex:none;
    border-radius:11px;
    background:linear-gradient(135deg,var(--company),var(--bu3));
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);
    font-weight:800;
    font-size:14px;
    color:#0a0c10;
    user-select:none;
  }
  .brand h1{
    margin:0;
    font-size:21px;
    letter-spacing:0.1px;
    font-weight:800;
    display:flex;
    align-items:baseline;
    gap:10px;
    color:var(--text);
  }
  .brand h1 .total{
    font-family:var(--mono);
    font-size:12.5px;
    font-weight:600;
    color:var(--text-faint);
  }
  .brand p{
    margin:2px 0 0;
    font-size:12.5px;
    color:var(--text-dim);
  }
  .admin-badge{
    display:none;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;font-weight:700;
    color:#0F131B;background:linear-gradient(135deg,var(--company),var(--bu3));padding:4px 10px;border-radius:20px;
  }
  body.admin-mode .admin-badge{display:inline-flex;}
  body:not(.admin-mode) .admin-only{display:none !important;}

  .topbar .controls{display:flex;gap:10px;align-items:center;}
  .search-wrap{position:relative;display:flex;align-items:center;}
  .search-wrap svg{position:absolute;left:14px;width:16px;height:16px;color:var(--text-faint);pointer-events:none;}
  #search{
    width:340px;background:var(--card);border:1px solid var(--border-soft);color:var(--text);
    border-radius:10px;padding:12px 14px 12px 38px;font-size:15px;outline:none;transition:border-color .15s,background .15s;
  }
  #search:focus{border-color:var(--company);background:var(--card-hover);}
  #search::placeholder{color:var(--text-faint);}
  .btn{
    border:none;cursor:pointer;border-radius:10px;font-size:14px;font-weight:700;padding:10px 16px;
    display:inline-flex;align-items:center;gap:7px;font-family:var(--sans);
    transition:transform .1s, opacity .15s, background .15s;
  }
  .btn:active{transform:scale(0.97);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-primary{background:var(--text);color:#12151b;}
  .btn-primary:hover{opacity:0.88;}
  .btn-ghost{background:var(--card);color:var(--text-dim);border:1px solid var(--border-soft);}
  .btn-ghost:hover{color:var(--text);border-color:var(--border);}
  .btn-danger{background:var(--danger-soft);color:var(--danger);}
  .btn-danger:hover{background:rgba(255,107,129,0.22);}

  main{flex:1;min-height:0;}

  /* ---------- Board: 2 macro columns (회사 / BU3) ---------- */
  .board{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:22px;
    align-items:start;
  }
  @media (max-width:900px){ .board{grid-template-columns:1fr;} }

  .macro{min-width:0;}
  .macro-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .macro-bar{width:4px;height:32px;border-radius:3px;flex:none;background:var(--company);}
  .macro-bu3 .macro-bar{background:var(--bu3);}
  .macro-icon{
    width:34px;height:34px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;
    background:var(--company-soft-2);color:var(--company);
  }
  .macro-bu3 .macro-icon{background:var(--bu3-soft-2);color:var(--bu3);}
  .macro-icon svg{width:18px;height:18px;}
  .macro-title h2{margin:0;font-size:21px;font-weight:800;color:var(--text);letter-spacing:0.1px;}
  .macro-title p{margin:1px 0 0;font-size:12.5px;color:var(--text-faint);}

  .subsection{margin-bottom:18px;}
  .subsection:last-child{margin-bottom:0;}
  .sub-head{
    display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;
    padding:9px 14px;border-radius:8px;margin-bottom:10px;letter-spacing:0.01em;
  }
  .sub-head svg{width:14px;height:14px;flex:none;}
  .sub-head .sub-count{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:12.5px;opacity:.9;}
  .sub-head.sub-public{background:var(--company-soft);color:var(--company);}
  .macro-bu3 .sub-head.sub-public{background:var(--bu3-soft);color:var(--bu3);}
  .sub-head.sub-internal{
    background:var(--internal-soft);color:var(--internal);
    border:1px solid rgba(240,151,90,0.35);
  }

  .tilegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
  @media (max-width:1250px){ .tilegrid{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media (max-width:900px){ .tilegrid{grid-template-columns:repeat(3,minmax(0,1fr));} }
  @media (max-width:560px){ .tilegrid{grid-template-columns:repeat(2,minmax(0,1fr));} }

  .tile-cell{min-width:0;}
  body.admin-mode .tile-cell[draggable="true"]{cursor:grab;}
  body.admin-mode .exp-row[draggable="true"]{cursor:grab;}
  .tile-cell.dragging, .exp-row.dragging{opacity:.35;}

  .tile{
    width:100%;min-height:92px;border-radius:var(--radius);background:var(--card);
    border:1px solid var(--border-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:7px;cursor:pointer;position:relative;padding:14px 10px;
    transition:background .15s, border-color .15s, transform .12s, box-shadow .15s;
  }
  .tile:hover{background:var(--card-hover);border-color:var(--border);transform:translateY(-2px);}

  /* 자주 사용/중요 지정 사이트 강조 */
  .tile.pinned{
    border-color:rgba(255,201,77,0.38);
    background:linear-gradient(180deg, var(--pin-soft), transparent 65%) var(--card);
    box-shadow:0 0 0 1px rgba(255,201,77,0.08);
  }
  .tile.pinned:hover{
    border-color:rgba(255,201,77,0.6);
    background:linear-gradient(180deg, rgba(255,201,77,0.14), transparent 65%) var(--card-hover);
  }
  .tile.pinned .name{font-weight:700;}

  .tile .icon-wrap{
    width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.04);color:var(--text-faint);transition:color .15s, background .15s;
    position:relative;
  }
  .tile .icon-wrap svg{width:16px;height:16px;}
  .macro-company .tile:hover .icon-wrap{color:var(--company);background:var(--company-soft-2);}
  .macro-bu3 .tile:hover .icon-wrap{color:var(--bu3);background:var(--bu3-soft-2);}

  .pin-star{
    position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;
    background:var(--pin);color:#221a06;display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 2px var(--card);
  }
  .tile:hover .pin-star{box-shadow:0 0 0 2px var(--card-hover);}
  .pin-star svg{width:9px;height:9px;}

  .tile .name{
    font-size:16px;font-weight:600;text-align:center;color:var(--text);
    line-height:1.25;max-width:100%;
  }

  .tile .badge{
    position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:11px;font-weight:700;
    padding:3px 7px;border-radius:20px;background:var(--company-soft);color:var(--company);line-height:1.5;
  }
  .macro-bu3 .tile .badge{background:var(--bu3-soft);color:var(--bu3);}

  .tile-actions{position:absolute;top:6px;left:6px;display:flex;gap:2px;opacity:0;transition:opacity .12s;}
  .tile:hover .tile-actions{opacity:1;}
  .icon-btn{
    width:21px;height:21px;display:flex;align-items:center;justify-content:center;background:none;border:none;
    color:var(--text-faint);cursor:pointer;border-radius:6px;
  }
  .icon-btn:hover{background:rgba(255,255,255,0.06);color:var(--text);}
  .icon-btn.danger:hover{color:var(--danger);}
  .icon-btn.pin-toggle-btn.active{color:var(--pin);}
  .icon-btn.pin-toggle-btn:hover{color:var(--pin);}
  .icon-btn svg{width:12px;height:12px;}

  .tile-expand{
    margin-top:6px;background:rgba(255,255,255,0.03);border:1px solid var(--border-soft);border-radius:10px;
    padding:6px 9px;
  }
  .exp-row{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--border-soft);}
  .exp-row:last-child{border-bottom:none;}
  .exp-row .e-title{
    flex:1;font-size:13px;font-weight:600;color:var(--text);text-decoration:none;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .exp-row.pinned-row .e-title{font-weight:800;}
  .pin-star-inline{width:12px;height:12px;flex:none;color:var(--pin);display:flex;align-items:center;justify-content:center;}
  .pin-star-inline svg{width:12px;height:12px;}
  .macro-company .exp-row .e-title:hover{color:var(--company);}
  .macro-bu3 .exp-row .e-title:hover{color:var(--bu3);}
  .exp-row .e-actions{display:flex;gap:1px;flex:none;}
  .exp-row .e-actions .icon-btn{width:19px;height:19px;}
  .exp-row .e-actions .icon-btn svg{width:11px;height:11px;}

  .empty{text-align:center;padding:40px 20px;color:var(--text-faint);font-size:13.5px;}
  .subsection .empty{padding:16px 6px;font-size:12px;}

  .results{display:flex;flex-direction:column;gap:10px;}
  .result-card{
    background:var(--card);border:1px solid var(--border-soft);border-radius:12px;
    padding:14px 16px;display:flex;align-items:center;gap:12px;text-decoration:none;
    transition:background .15s, border-color .15s;
  }
  .result-card:hover{background:var(--card-hover);border-color:var(--border);}
  .result-card .r-icon{
    width:34px;height:34px;flex:none;border-radius:9px;background:rgba(255,255,255,0.04);
    display:flex;align-items:center;justify-content:center;color:var(--text-dim);
  }
  .result-card .r-icon svg{width:16px;height:16px;}
  .result-card .r-main{flex:1;min-width:0;}
  .result-card .r-title{font-size:15px;font-weight:700;color:var(--text);}
  .result-card .r-crumb{font-family:var(--mono);font-size:11.5px;color:var(--text-faint);margin-top:2px;}
  .result-card .r-actions{display:flex;gap:4px;}

  .tip{position:relative;display:inline-flex;color:var(--text-faint);cursor:default;}
  .tip svg{width:13px;height:13px;}
  .tip::after{
    content:attr(data-tip);position:absolute;left:50%;bottom:130%;transform:translateX(-50%) translateY(4px);
    background:#232B38;color:var(--text);font-size:12px;line-height:1.4;padding:7px 10px;border-radius:8px;
    width:max-content;max-width:220px;white-space:normal;box-shadow:0 6px 20px rgba(0,0,0,0.5);
    opacity:0;pointer-events:none;transition:opacity .12s, transform .12s;z-index:20;
  }
  .tip:hover::after{opacity:1;transform:translateX(-50%) translateY(0);}

  .overlay{position:fixed;inset:0;background:rgba(6,8,12,0.65);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:440px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,0.55);max-height:86vh;overflow-y:auto;}
  .modal h2{margin:0 0 4px;font-size:17px;display:flex;align-items:center;justify-content:space-between;color:var(--text);}
  .modal-close{
    background:none;border:none;color:var(--text-faint);font-size:22px;line-height:1;cursor:pointer;
    padding:0 2px;border-radius:6px;
  }
  .modal-close:hover{color:var(--text);}
  .modal .sub{margin:0 0 16px;font-size:12.5px;color:var(--text-dim);}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--text-dim);margin-bottom:6px;}
  .field .req{color:var(--bu3);}
  .field input, .field select, .field textarea{
    width:100%;background:var(--bg);border:1px solid var(--border-soft);color:var(--text);border-radius:9px;
    padding:9px 11px;font-size:14px;font-family:var(--sans);outline:none;
  }
  .field textarea{resize:vertical;min-height:60px;font-family:var(--sans);}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--company);}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}
  .modal-actions .right{display:flex;gap:8px;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--card-hover);
    border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:10px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:200;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  :focus-visible{outline:2px solid var(--company);outline-offset:2px;}

  @media (max-width:760px){
    .app{padding:16px 14px 28px;}
    .topbar{flex-direction:column;align-items:stretch;}
    .topbar .controls{width:100%;}
    #search{flex:1;width:auto;}
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark" id="brandMark">B3</div>
      <div>
        <h1>BU3 Site Directory <span class="total" id="totalCount"></span> <span class="admin-badge" id="adminBadge">관리자 모드</span></h1>
        <p>회사 · BU3 시스템 링크 모음</p>
      </div>
    </div>
    <div class="controls">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="search" placeholder="사이트, 설명 검색…" />
      </div>
      <button class="btn btn-primary admin-only" id="addBtn">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>
        링크 추가
      </button>
    </div>
  </div>

  <main id="content"><div class="empty">불러오는 중…</div></main>

</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

    globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 4 6 4 9s-1.5 6.3-4 9c-2.5-2.7-4-6-4-9s1.5-6.3 4-9z"/></svg>',
    lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>',
    star: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2.5l3.09 6.26 6.91 1.01-5 4.87 1.18 6.87L12 18.02l-6.18 3.49L7 14.64l-5-4.87 6.91-1.01L12 2.5z"/></svg>',
    starOutline: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.5l3.09 6.26 6.91 1.01-5 4.87 1.18 6.87L12 18.02l-6.18 3.49L7 14.64l-5-4.87 6.91-1.01L12 2.5z"/></svg>'
  };

  // 그룹명 -> 아이콘 글리프 (색상은 대분류 accent로 통일, 여기서는 형태만 구분)
  var GROUP_ICON = {
    'INTEKPLUS Project Portal': 'grid',
    'CXM': 'message',
    'CWM': 'shield',
    'WMS': 'warehouse',
    'PMS': 'dashboard',
    'iCOMPASS': 'compass',
    'SQR': 'checkcircle',
    '회의록': 'filetext',
    '법인카드': 'card',
    'MAPS': 'map',
    'Vision Alarm Manager': 'bell',
    '출장일정관리': 'calendar',
    '구매관리': 'cart',
    '대시보드': 'dashboard'
  };
  function getIcon(gname){ return GROUP_ICON[gname] || 'link'; }

  // 즐겨찾기는 링크별 pinned 값으로 관리 (관리자 모드에서 별 아이콘으로 On/Off).
  // 아래 LEGACY_* 는 pinned 값이 아직 없는 기존 데이터(예전 하드코딩 방식)에 대한 기본값이며,
  // 한 번이라도 토글하면 그 링크는 명시적인 pinned 값을 갖게 되어 이 기본값을 더 이상 참조하지 않는다.
  var LEGACY_PINNED_GROUPS = new Set([
    'INTEKPLUS Project Portal', 'CXM', 'CWM', 'WMS', 'PMS',
    'Vision Alarm Manager', '출장일정관리'
  ]);
  var LEGACY_PINNED_SUBS = {
    '대시보드': new Set(['CXM(admin)', 'CWM(admin)', 'PMS'])
  };
  function isPinned(l){
    if(typeof l.pinned === 'boolean') return l.pinned;
    return LEGACY_PINNED_GROUPS.has(l.group) || !!(LEGACY_PINNED_SUBS[l.group] && LEGACY_PINNED_SUBS[l.group].has(l.sub));
  }
  function groupHasPinned(items){ return items.some(isPinned); }

  var MACROS = ['회사', 'BU3'];
  var MACRO_META = {
    '회사': {icon:'building', tagline:'회사에서 운영/제공하는 시스템'},
    'BU3': {icon:'layers', tagline:'BU3에서 자체 개발/운영하는 시스템'}
  };
  var ACCESS_TYPES = ['사내+외부', '사내전용'];

  var state = {
    links: [],
    query: '',
    isAdmin: false,
    openGroups: new Set()
  };

  function escapeHtml(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2400);
  }

  function applyAdminClass(){ document.body.classList.toggle('admin-mode', state.isAdmin); }
  (function initAdmin(){
    try{ state.isAdmin = localStorage.getItem('bu3_admin') === '1'; }catch(e){}
    applyAdminClass();
  })();
  function toggleAdmin(){
    state.isAdmin = !state.isAdmin;
    try{ localStorage.setItem('bu3_admin', state.isAdmin ? '1' : '0'); }catch(e){}
    applyAdminClass();
    render();
    showToast(state.isAdmin ? '관리자 모드로 전환했습니다.' : '일반(보기) 모드로 전환했습니다.');
  }

  async function api(path, options){
    var res = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, options || {}));
    var data = null;
    try{ data = await res.json(); }catch(e){}
    if(!res.ok){ throw new Error((data && data.error) || ('요청 실패 (' + res.status + ')')); }
    return data;
  }

  async function load(){
    try{
      var data = await api('/api/links');
      state.links = data.links || [];
    }catch(e){
      console.error(e);
      document.getElementById('content').innerHTML = '<div class="empty">데이터를 불러오지 못했습니다. 새로고침해주세요.<br><span style="font-family:var(--mono);font-size:11px;">' + escapeHtml(e.message) + '</span></div>';
      return;
    }
    render();
  }

  function groupBy(links){
    var out = {};
    links.forEach(function(l){
      out[l.mainCategory] = out[l.mainCategory] || {};
      out[l.mainCategory][l.accessType] = out[l.mainCategory][l.accessType] || {};
      out[l.mainCategory][l.accessType][l.group] = out[l.mainCategory][l.accessType][l.group] || [];
      out[l.mainCategory][l.accessType][l.group].push(l);
    });
    return out;
  }

  function updateTotal(){
    document.getElementById('totalCount').textContent = state.links.length ? ('총 ' + state.links.length + '개') : '';
  }

  function render(){
    updateTotal();
    var content = document.getElementById('content');
    var q = state.query.trim().toLowerCase();
    if(q){ renderSearchResults(content, q); return; }

    var grouped = groupBy(state.links);
    var html = '<div class="board">';
    MACROS.forEach(function(main){ html += renderMacro(main, grouped); });
    html += '</div>';
    content.innerHTML = html;
    bindGridEvents();
  }

  function renderMacro(main, grouped){
    var meta = MACRO_META[main];
    var macroClass = main === 'BU3' ? 'macro-bu3' : 'macro-company';

    var subsHtml = ACCESS_TYPES.map(function(access){
      var groupsMap = (grouped[main] && grouped[main][access]) || {};
      var groupNames = Object.keys(groupsMap);
      var total = 0;
      groupNames.forEach(function(g){ total += groupsMap[g].length; });

      var tilesHtml;
      if(groupNames.length === 0){
        tilesHtml = '<div class="empty">링크 없음</div>';
      }else{
        tilesHtml = groupNames.map(function(gname){
          var items = groupsMap[gname];
          var inner = items.length === 1 ? renderDirectTile(items[0]) : renderCountTile(main, access, gname, items);
          var ids = items.map(function(l){ return l.id; }).join(',');
          return '<div class="tile-cell"' + (state.isAdmin ? ' draggable="true"' : '') + ' data-drag-ids="' + ids + '">' + inner + '</div>';
        }).join('');
      }

      var subHeadClass = access === '사내전용' ? 'sub-internal' : 'sub-public';
      var subIcon = access === '사내전용' ? ICONS.lock : ICONS.globe;

      return (
        '<div class="subsection">' +
          '<div class="sub-head ' + subHeadClass + '">' + subIcon +
            '<span>' + escapeHtml(access) + '</span>' +
            '<span class="sub-count">' + total + '개</span>' +
          '</div>' +
          '<div class="tilegrid">' + tilesHtml + '</div>' +
        '</div>'
      );
    }).join('');

    return (
      '<div class="macro ' + macroClass + '">' +
        '<div class="macro-head">' +
          '<span class="macro-bar"></span>' +
          '<div class="macro-icon">' + ICONS[meta.icon] + '</div>' +
          '<div class="macro-title">' +
            '<h2>' + escapeHtml(main) + '</h2>' +
            '<p>' + escapeHtml(meta.tagline) + '</p>' +
          '</div>' +
        '</div>' +
        subsHtml +
      '</div>'
    );
  }

  function pinToggleBtn(l){
    var pinned = isPinned(l);
    return '<button class="icon-btn admin-only pin-toggle-btn' + (pinned ? ' active' : '') + '" data-id="' + l.id + '" title="' +
      (pinned ? '즐겨찾기 해제' : '즐겨찾기 추가') + '">' + (pinned ? ICONS.star : ICONS.starOutline) + '</button>';
  }

  function renderDirectTile(l){
    var icon = getIcon(l.group);
    var pinned = isPinned(l);
    return (
      '<div class="tile direct' + (pinned ? ' pinned' : '') + '" data-open-url="' + escapeHtml(l.url) + '">' +
        '<div class="icon-wrap">' + ICONS[icon] +
          (pinned ? '<span class="pin-star" title="자주 사용하는 주요 시스템">' + ICONS.star + '</span>' : '') +
        '</div>' +
        '<div class="name">' + escapeHtml(l.group) + '</div>' +
        '<div class="tile-actions">' +
          (l.desc ? '<span class="tip" data-tip="' + escapeHtml(l.desc) + '">' + ICONS.info + '</span>' : '') +
          pinToggleBtn(l) +
          '<button class="icon-btn admin-only edit-tile-btn" data-id="' + l.id + '" title="수정">' + ICONS.edit + '</button>' +
          '<button class="icon-btn admin-only danger del-tile-btn" data-id="' + l.id + '" title="삭제">' + ICONS.trash + '</button>' +
        '</div>' +
      '</div>'
    );
  }

  function renderCountTile(main, access, gname, items){
    var key = main + '|' + access + '|' + gname;
    var isOpen = state.openGroups.has(key);
    var icon = getIcon(gname);
    var pinned = groupHasPinned(items);
    var rows = items.map(function(l){
      var label = l.sub ? l.sub : gname;
      var rowPinned = isPinned(l);
      var tip = l.desc ? '<span class="tip" data-tip="' + escapeHtml(l.desc) + '">' + ICONS.info + '</span>' : '';
      return (
        '<div class="exp-row' + (rowPinned ? ' pinned-row' : '') + '"' + (state.isAdmin ? ' draggable="true"' : '') + ' data-drag-ids="' + l.id + '">' +
          (rowPinned ? '<span class="pin-star-inline" title="자주 사용하는 주요 시스템">' + ICONS.star + '</span>' : '') +
          '<a class="e-title" href="' + escapeHtml(l.url) + '" target="_blank" rel="noopener">' + escapeHtml(label) + '</a>' + tip +
          '<div class="e-actions admin-only">' +
            pinToggleBtn(l) +
            '<button class="icon-btn edit-exp-btn" data-id="' + l.id + '" title="수정">' + ICONS.edit + '</button>' +
            '<button class="icon-btn danger del-exp-btn" data-id="' + l.id + '" title="삭제">' + ICONS.trash + '</button>' +
          '</div>' +
        '</div>'
      );
    }).join('');

    return (
      '<div class="tile' + (isOpen ? ' open' : '') + (pinned ? ' pinned' : '') + '" data-toggle-group="' + escapeHtml(key) + '">' +
        '<span class="badge">' + items.length + '</span>' +
        '<div class="icon-wrap">' + ICONS[icon] +
          (pinned ? '<span class="pin-star" title="자주 사용하는 주요 시스템">' + ICONS.star + '</span>' : '') +
        '</div>' +
        '<div class="name">' + escapeHtml(gname) + '</div>' +
      '</div>' +
      (isOpen ? '<div class="tile-expand">' + rows + '</div>' : '')
    );
  }

  function bindGridEvents(){
    document.querySelectorAll('[data-open-url]').forEach(function(tile){
      tile.addEventListener('click', function(e){
        if(e.target.closest('.icon-btn') || e.target.closest('.tip')) return;
        window.open(tile.dataset.openUrl, '_blank', 'noopener');
      });
    });
    document.querySelectorAll('[data-toggle-group]').forEach(function(tile){
      tile.addEventListener('click', function(){
        var key = tile.dataset.toggleGroup;
        if(state.openGroups.has(key)) state.openGroups.delete(key);
        else state.openGroups.add(key);
        render();
      });
    });
    document.querySelectorAll('.edit-tile-btn, .edit-exp-btn').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var link = state.links.find(function(l){ return l.id === btn.dataset.id; });
        if(link) openModal(link);
      });
    });
    document.querySelectorAll('.del-tile-btn, .del-exp-btn').forEach(function(btn){
      btn.addEventListener('click', async function(e){
        e.stopPropagation();
        var ok = await deleteLink(btn.dataset.id);
        if(ok) render();
      });
    });
    document.querySelectorAll('.pin-toggle-btn').forEach(function(btn){
      btn.addEventListener('click', async function(e){
        e.stopPropagation();
        var link = state.links.find(function(l){ return l.id === btn.dataset.id; });
        if(!link) return;
        var newVal = !isPinned(link);
        try{
          var result = await api('/api/links/' + encodeURIComponent(link.id), { method: 'PATCH', body: JSON.stringify({ pinned: newVal }) });
          link.pinned = result.link.pinned;
          render();
        }catch(err){
          showToast(err.message || '즐겨찾기 변경에 실패했습니다.');
        }
      });
    });
    if(state.isAdmin){
      bindDragReorder('.tilegrid', '.tile-cell');
      bindDragReorder('.tile-expand', '.exp-row');
    }
  }

  // 관리자 모드에서 같은 그리드(.tilegrid) / 같은 펼침목록(.tile-expand) 안에서만
  // 드래그로 순서를 바꿀 수 있게 해주는 최소 구현 (네이티브 HTML5 Drag & Drop)
  function getDragAfterElement(container, selector, x, y){
    var els = Array.prototype.slice.call(container.querySelectorAll(selector))
      .filter(function(el){ return !el.classList.contains('dragging'); });
    var closest = null, closestDist = Infinity, before = false;
    els.forEach(function(el){
      var box = el.getBoundingClientRect();
      var cx = box.left + box.width / 2, cy = box.top + box.height / 2;
      var dist = Math.hypot(x - cx, y - cy);
      if(dist < closestDist){
        closestDist = dist;
        closest = el;
        var sameRow = Math.abs(y - cy) < box.height / 2;
        before = sameRow ? (x < cx) : (y < cy);
      }
    });
    if(!closest) return null;
    return before ? closest : closest.nextElementSibling;
  }

  function bindDragReorder(containerSelector, itemSelector){
    document.querySelectorAll(containerSelector).forEach(function(container){
      container.querySelectorAll(itemSelector).forEach(function(item){
        item.addEventListener('dragstart', function(e){
          e.stopPropagation(); // 중첩된 tile-cell/tile-expand 드래그가 서로 간섭하지 않도록 차단
          item.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', '');
        });
        item.addEventListener('dragend', function(e){
          e.stopPropagation();
          item.classList.remove('dragging');
          var ids = Array.prototype.slice.call(container.querySelectorAll(itemSelector))
            .map(function(el){ return el.dataset.dragIds; }).join(',').split(',').filter(Boolean);
          persistReorder(ids);
        });
      });
      container.addEventListener('dragover', function(e){
        var dragging = container.querySelector('.dragging');
        if(!dragging) return;
        e.preventDefault();
        e.stopPropagation();
        var after = getDragAfterElement(container, itemSelector, e.clientX, e.clientY);
        if(after == null) container.appendChild(dragging);
        else if(after !== dragging) container.insertBefore(dragging, after);
      });
    });
  }

  function persistReorder(newIds){
    if(!newIds || newIds.length < 2) return;
    var idSet = {};
    newIds.forEach(function(id){ idSet[id] = true; });
    var byId = {};
    state.links.forEach(function(l){ byId[l.id] = l; });
    var queue = newIds.slice();
    state.links = state.links.map(function(l){ return idSet[l.id] ? byId[queue.shift()] : l; });
    render();
    api('/api/links', { method: 'PUT', body: JSON.stringify({ order: state.links.map(function(l){ return l.id; }) }) })
      .catch(function(err){ showToast(err.message || '순서 저장에 실패했습니다.'); });
  }

  function renderSearchResults(content, q){
    var results = state.links.filter(function(l){
      var hay = [l.group, l.sub, l.url, l.desc, l.mainCategory, l.accessType].join(' ').toLowerCase();
      return hay.indexOf(q) !== -1;
    });
    if(results.length === 0){
      content.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
      return;
    }
    var html = '<div class="results">';
    results.forEach(function(l){
      var label = l.sub ? l.sub : l.group;
      var crumb = l.mainCategory + ' · ' + l.accessType + (l.sub ? (' · ' + l.group) : '');
      var tip = l.desc ? '<span class="tip" data-tip="' + escapeHtml(l.desc) + '">' + ICONS.info + '</span>' : '';
      html +=
        '<div class="result-card" data-id="' + l.id + '">' +
          '<div class="r-icon">' + ICONS[getIcon(l.group)] + '</div>' +
          '<div class="r-main">' +
            '<a class="r-title" href="' + escapeHtml(l.url) + '" target="_blank" rel="noopener">' + escapeHtml(label) + '</a> ' + tip +
            '<div class="r-crumb">' + escapeHtml(crumb) + '</div>' +
          '</div>' +
          '<div class="r-actions admin-only">' +
            pinToggleBtn(l) +
            '<button class="icon-btn edit-tile-btn" data-id="' + l.id + '" title="수정">' + ICONS.edit + '</button>' +
            '<button class="icon-btn danger del-tile-btn" data-id="' + l.id + '" title="삭제">' + ICONS.trash + '</button>' +
          '</div>' +
        '</div>';
    });
    html += '</div>';
    content.innerHTML = html;
    bindGridEvents();
  }

  async function deleteLink(id){
    var link = state.links.find(function(l){ return l.id === id; });
    if(!link) return false;
    var label = link.sub ? (link.group + ' · ' + link.sub) : link.group;
    if(!confirm('"' + label + '" 링크를 삭제할까요?')) return false;
    try{
      await api('/api/links/' + encodeURIComponent(id), { method: 'DELETE' });
      state.links = state.links.filter(function(l){ return l.id !== id; });
      showToast('삭제했습니다.');
      return true;
    }catch(err){
      showToast(err.message || '삭제에 실패했습니다.');
      return false;
    }
  }

  function existingGroups(mainCategory, accessType){
    var set = {};
    state.links.forEach(function(l){
      if(l.mainCategory === mainCategory && l.accessType === accessType) set[l.group] = true;
    });
    return Object.keys(set);
  }

  function openModal(existing){
    var isEdit = !!existing;
    var data = existing || {mainCategory:'회사', accessType:'사내+외부', group:'', sub:'', url:'', desc:''};
    var root = document.getElementById('modalRoot');

    var groupOptions = existingGroups(data.mainCategory, data.accessType)
      .map(function(g){ return '<option value="' + escapeHtml(g) + '">'; }).join('');

    root.innerHTML =
      '<div class="overlay" id="overlay">' +
        '<div class="modal">' +
          '<h2>' + (isEdit ? '링크 수정' : '새 링크 추가') + '<button class="modal-close" id="closeModalX" title="닫기">&times;</button></h2>' +
          '<p class="sub">' + (isEdit ? '이 항목만 수정됩니다.' : '카테고리를 지정하고 링크를 등록하세요.') + '</p>' +

          '<div class="field-row">' +
            '<div class="field">' +
              '<label>대분류 <span class="req">*</span></label>' +
              '<select id="f-main">' +
                '<option value="회사"' + (data.mainCategory==='회사'?' selected':'') + '>회사</option>' +
                '<option value="BU3"' + (data.mainCategory==='BU3'?' selected':'') + '>BU3</option>' +
              '</select>' +
            '</div>' +
            '<div class="field">' +
              '<label>접근범위 <span class="req">*</span></label>' +
              '<select id="f-access">' +
                '<option value="사내+외부"' + (data.accessType==='사내+외부'?' selected':'') + '>사내+외부</option>' +
                '<option value="사내전용"' + (data.accessType==='사내전용'?' selected':'') + '>사내전용</option>' +
              '</select>' +
            '</div>' +
          '</div>' +

          '<div class="field">' +
            '<label>중분류 (그룹명) <span class="req">*</span></label>' +
            '<input id="f-group" list="group-suggest" value="' + escapeHtml(data.group) + '" placeholder="예: CXM, WMS, MAPS…" />' +
            '<datalist id="group-suggest">' + groupOptions + '</datalist>' +
          '</div>' +

          '<div class="field">' +
            '<label>세부항목 (선택)</label>' +
            '<input id="f-sub" value="' + escapeHtml(data.sub) + '" placeholder="예: LGES — 비워두면 단독 링크로 표시" />' +
          '</div>' +

          '<div class="field">' +
            '<label>URL <span class="req">*</span></label>' +
            '<input id="f-url" value="' + escapeHtml(data.url) + '" placeholder="https:// 또는 http://IP:포트" />' +
          '</div>' +

          '<div class="field">' +
            '<label>설명 (선택 — 마우스오버 툴팁으로 표시)</label>' +
            '<textarea id="f-desc" placeholder="이 링크가 무엇인지 짧게 설명해주세요">' + escapeHtml(data.desc) + '</textarea>' +
          '</div>' +

          '<div class="modal-actions">' +
            (isEdit ? '<button class="btn btn-danger" id="deleteInModal">삭제</button>' : '<span></span>') +
            '<div class="right">' +
              '<button class="btn btn-ghost" id="cancelModal">취소</button>' +
              '<button class="btn btn-primary" id="saveModal">저장</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    document.getElementById('f-main').addEventListener('change', refreshGroupSuggest);
    document.getElementById('f-access').addEventListener('change', refreshGroupSuggest);
    function refreshGroupSuggest(){
      var m = document.getElementById('f-main').value;
      var a = document.getElementById('f-access').value;
      document.getElementById('group-suggest').innerHTML = existingGroups(m,a)
        .map(function(g){ return '<option value="' + escapeHtml(g) + '">'; }).join('');
    }

    document.getElementById('closeModalX').addEventListener('click', closeModal);
    document.getElementById('cancelModal').addEventListener('click', closeModal);

    document.getElementById('saveModal').addEventListener('click', async function(){
      var main = document.getElementById('f-main').value;
      var access = document.getElementById('f-access').value;
      var group = document.getElementById('f-group').value.trim();
      var sub = document.getElementById('f-sub').value.trim();
      var url = document.getElementById('f-url').value.trim();
      var desc = document.getElementById('f-desc').value.trim();

      if(!group){ showToast('중분류(그룹명)를 입력해주세요.'); return; }
      if(!url){ showToast('URL을 입력해주세요.'); return; }
      if(!/^https?:\/\//i.test(url)){ showToast('URL은 http:// 또는 https:// 로 시작해야 합니다.'); return; }

      var payload = { mainCategory: main, accessType: access, group: group, sub: sub, url: url, desc: desc };
      var saveBtn = document.getElementById('saveModal');
      saveBtn.disabled = true;

      try{
        if(isEdit){
          var result = await api('/api/links/' + encodeURIComponent(existing.id), { method:'PUT', body:JSON.stringify(payload) });
          var i = state.links.findIndex(function(l){ return l.id === existing.id; });
          if(i !== -1) state.links[i] = result.link;
        }else{
          var created = await api('/api/links', { method:'POST', body:JSON.stringify(payload) });
          state.links.push(created.link);
        }
        showToast(isEdit ? '수정했습니다.' : '추가했습니다.');
        closeModal();
        render();
      }catch(err){
        saveBtn.disabled = false;
        showToast(err.message || '저장에 실패했습니다.');
      }
    });

    if(isEdit){
      document.getElementById('deleteInModal').addEventListener('click', async function(){
        var ok = await deleteLink(existing.id);
        if(ok){ closeModal(); render(); }
      });
    }

    document.getElementById('f-group').focus();
  }

  function closeModal(){
    document.getElementById('modalRoot').innerHTML = '';
  }

  document.getElementById('brandMark').addEventListener('click', function(e){
    if(e.ctrlKey || e.metaKey){
      e.preventDefault();
      toggleAdmin();
    }
  });
  document.getElementById('addBtn').addEventListener('click', function(){ openModal(null); });
  document.getElementById('search').addEventListener('input', function(e){
    state.query = e.target.value;
    render();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeModal();
  });

  load();
})();
</script>
</body>
</html>
